name: Texturepack encryption

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  create:
    tags:
      - '*'

jobs:
  pack-encryption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create histeria-pack directory and move files
        run: |
          mkdir histeria-pack
          rsync -av --exclude-from=./.gitignore ./ ./histeria-pack/ --remove-source-files
        shell: bash

      - name: Download mcruptil tool from release and encrypt pack
        run: |
          wget -O ./mcrputil https://github.com/valaphee/mcrputil/releases/download/1.2.0/mcrputil
          chmod +x ./mcrputil
          ./mcrputil encrypt "histeria-pack" "./encoded-pack/HisteriaPack" --key "${{ secrets.ENCRYPTION_KEY }}"
        shell: bash

      - name: Zip encrypted texture pack
        run: cd ./encoded-pack/HisteriaPack && zip -r ../../HisteriaPack.zip ./*

      - name: Upload encrypted texture pack as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-encrypted-texture-pack
          path: HisteriaPack.zip

  publish-release:
    # This job triggers only on tag creation
    needs: pack-encryption
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download encrypted texture pack artifact
        uses: actions/download-artifact@v4
        with:
          name: zip-encrypted-texture-pack
          path: ./

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }} # Tag that triggered the workflow
          release_name: HisteriaPack ${{ github.ref }}
          body: "Automated release of encrypted texture pack."
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload encrypted texture pack to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./HisteriaPack.zip
          asset_name: HisteriaPack.zip
          asset_content_type: application/zip