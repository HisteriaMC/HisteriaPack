name: Texturepack encryption

on:
  push:
    branches:
      - 'main'
      - 'v7'
    tags:
      - '*'


jobs:
  build:
    runs-on: ubuntu-latest
    if: "contains(github.event.head_commit.message, '[Build]')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pngquant
        run: |
          sudo apt-get update
          sudo apt-get install -y pngquant

      - name: Compress PNG files
        run: find . -name '*.png' -type f -exec pngquant --strip --quality=65-80 --ext .png --force "{}" \;

      - name: Compile json_comments
        run: |
          git clone https://github.com/mewalig/json-comments /tmp/json-comments
          echo "Compiling json_comment"
          cc -o /tmp/json-comments/json_comment /tmp/json-comments/json_comment.c

      - name: Minify JSON files
        run: |
          find . -name '*.json' -type f | while read fjson; do
            echo "Stripping comments from $fjson"
            cat "$fjson" | /tmp/json-comments/json_comment --strip /dev/null > "$fjson.tmp"
            mv "$fjson.tmp" "$fjson"
          done

      - name: Push changes to build branch
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git checkout -B build
          git add .
          git commit -m 'Compressed PNG files and minified JSON' || echo "No changes to commit"
          git push origin build --force
          
  pack-encryption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Java 21 is installed
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Zip texture pack (with manifest.json)
        run: |
          mkdir -p build
          zip -r build/HisteriaPack.zip . -x '*.git*' -x 'build/*' -x 'encoded-pack/*'

      - name: Download EncryptMyPack
        run: |
          wget -O EncryptMyPack.jar https://github.com/AllayMC/EncryptMyPack/releases/download/2.0.1/EncryptMyPack-2.0.1-shaded.jar

      - name: Encrypt texture pack
        run: |
          mkdir -p encoded-pack
          java -jar EncryptMyPack.jar encrypt \
            --input build/HisteriaPack.zip \
            --output encoded-pack/HisteriaPack.zip \
            --key "${{ secrets.ENCRYPTION_KEY }}"

      - name: Upload encrypted texture pack as artifact
        uses: actions/upload-artifact@v4
        with:
          name: zip-encrypted-texture-pack
          path: encoded-pack/HisteriaPack.zip

  publish-release:
    # This job triggers only on tag creation
    needs: pack-encryption
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download encrypted texture pack artifact
        uses: actions/download-artifact@v4
        with:
          name: zip-encrypted-texture-pack
          path: ./

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }} # Tag that triggered the workflow
          release_name: HisteriaPack ${{ github.ref }}
          body: "Automated release of encrypted texture pack."
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload encrypted texture pack to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./HisteriaPack.zip
          asset_name: HisteriaPack.zip
          asset_content_type: application/zip
